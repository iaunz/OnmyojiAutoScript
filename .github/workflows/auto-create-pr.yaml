name: Auto Create PR from dev to master

on:
  schedule:
    # 每周四北京时间21点触发（UTC时间13点）
    - cron: '7 13 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or find automated sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TZ: Asia/Shanghai
        run: |
          PR_NUMBER=$(gh pr list \
            --base master \
            --head dev \
            --state open \
            --label automated \
            --json number \
            --jq '.[0].number')

          if [ -n "$PR_NUMBER" ]; then
            echo "Automated sync PR #$PR_NUMBER is already open."
            exit 0
          fi

          CURRENT_DATE=$(date +%Y.%m.%d)
          gh pr create \
            --base master \
            --head dev \
            --title "Automated PR $CURRENT_DATE" \
            --body "Automated PR created by GitHub Actions. Merge dev into master" \
            --label automated
